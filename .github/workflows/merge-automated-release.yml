# Alexander Tebiev - https://github.com/beeyev
name: Release 🚀

on:
  push:
    tags:
      - "v*.*.*" # Trigger on semantic version tags like v1.2.3

permissions:
  contents: write # For creating GitHub releases
  packages: write # If using GitHub Packages
  id-token: write # For signing GitHub artifact attestations
  attestations: write # For storing GitHub artifact attestations
  artifact-metadata: write # For recording attested artifacts

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 🛠 Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for GoReleaser to detect version info

      - name: 🧰 Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Verify module dependencies
        run: go mod verify

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: 🍫 install chocolatey
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          sudo apt-get --quiet update
          sudo apt-get --no-install-suggests --no-install-recommends --quiet --yes install dirmngr ca-certificates gnupg
          sudo gpg --homedir /tmp --no-default-keyring --keyring /usr/share/keyrings/mono-official-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/debian stable-buster main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt-get --quiet update
          sudo apt-get --no-install-suggests --no-install-recommends --quiet --yes install mono-devel
          mkdir -p /opt/chocolatey
          wget -q -O - "https://github.com/chocolatey/choco/releases/download/${CHOCOLATEY_VERSION}/chocolatey.v${CHOCOLATEY_VERSION}.tar.gz" | tar -xz -C "/opt/chocolatey"
          echo '#!/bin/bash' >> /usr/local/bin/choco
          echo 'mono /opt/chocolatey/choco.exe $@' >> /usr/local/bin/choco
          chmod +x /usr/local/bin/choco

          echo "🔹 Choco version: $(choco --version)"
        env:
          CHOCOLATEY_VERSION: 2.4.1

      - name: ℹ️ Version Info
        run: |
          echo "🔹 Go version: $(go version)"
          echo ""
          echo "🔹 Current tag: ${{ github.ref_name }}"

      - name: Validate AUR credentials
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          AUR_PRIVATE_SSH_KEY: ${{ secrets.AUR_PRIVATE_SSH_KEY }}
        run: |
          : "${AUR_PRIVATE_SSH_KEY:?Missing AUR_PRIVATE_SSH_KEY repository secret}"

      - name: 🚀 Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: >-
            release --clean
            ${{ contains(github.ref_name, '-') && '--skip=chocolatey' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          AUR_PRIVATE_SSH_KEY: ${{ secrets.AUR_PRIVATE_SSH_KEY }}

      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./dist
          format: spdx-json
          artifact-name: telegram-owl-${{ github.ref_name }}.spdx.json
          output-file: ./dist/telegram-owl-${{ github.ref_name }}.spdx.json
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false
          dependency-snapshot: true

      - name: Upload release handoff
        uses: actions/upload-artifact@v7
        with:
          name: release-handoff
          path: |
            dist/*.apk
            dist/*.deb
            dist/*.rpm
            dist/*_checksums.txt
            dist/digests.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload npm archive handoff
        uses: actions/upload-artifact@v7
        with:
          name: npm-archives
          path: |
            dist/telegram-owl_v*_Linux_64bit.tar.gz
            dist/telegram-owl_v*_Linux_ARM64.tar.gz
            dist/telegram-owl_v*_macOS_64bit.tar.gz
            dist/telegram-owl_v*_macOS_ARM64.tar.gz
            dist/telegram-owl_v*_Windows_64bit.zip
            dist/telegram-owl_v*_checksums.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  post-release:
    name: Attest & publish Linux packages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download release handoff
        uses: actions/download-artifact@v8
        with:
          name: release-handoff
          path: dist

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/telegram-owl_${{ github.ref_name }}_checksums.txt

      - name: Attest container images
        if: ${{ hashFiles('dist/digests.txt') != '' }}
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/digests.txt

      - name: Set up Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@v2
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Publish Linux packages to Cloudsmith
        shell: bash
        env:
          CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          : "${CLOUDSMITH_NAMESPACE:?Set the CLOUDSMITH_NAMESPACE repository variable}"
          : "${CLOUDSMITH_REPOSITORY:?Set the CLOUDSMITH_REPOSITORY repository variable}"

          publish_packages() {
            local format="$1"
            local target="$2"
            local label="$3"
            shift 3
            local packages=("$@")

            if ((${#packages[@]} == 0)); then
              printf 'No %s packages found in dist/\n' "$label" >&2
              return 1
            fi

            for package in "${packages[@]}"; do
              cloudsmith push "$format" --republish "$target" "$package"
            done
          }

          repository="${CLOUDSMITH_NAMESPACE}/${CLOUDSMITH_REPOSITORY}"
          deb_packages=(dist/*.deb)
          rpm_packages=(dist/*.rpm)
          apk_packages=(dist/*.apk)

          publish_packages deb "${repository}/any-distro/any-version" Debian "${deb_packages[@]}"
          publish_packages rpm "${repository}/any-distro/any-version" RPM "${rpm_packages[@]}"
          publish_packages alpine "${repository}/alpine/any-version" Alpine "${apk_packages[@]}"

  prepare-npm:
    name: Prepare npm packages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use npm 12
        run: |
          set -Eeuo pipefail
          npm install --global npm@12
          [[ "$(npm --version)" == 12.* ]]

      - name: Download npm archive handoff
        uses: actions/download-artifact@v8
        with:
          name: npm-archives
          path: npm/release

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Test npm package
        run: npm test

      - name: Build npm packages from release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          release_version="${RELEASE_TAG#v}"
          node scripts/build-packages.js \
            release \
            "$release_version" \
            release-packages

      - name: Verify real release binary and launcher
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          release_version="${RELEASE_TAG#v}"
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT

          mkdir -p "$verification_root/node_modules/@beeyev"
          cp -R \
            release-packages/telegram-owl \
            "$verification_root/node_modules/telegram-owl"
          cp -R \
            release-packages/telegram-owl-linux-x64 \
            "$verification_root/node_modules/@beeyev/telegram-owl-linux-x64"

          version_output="$(
            node \
              "$verification_root/node_modules/telegram-owl/bin/telegram-owl.js" \
              --version
          )"
          if ! grep -Fqx "telegram-owl v${release_version}" <<<"$version_output"; then
            printf 'Expected telegram-owl v%s, got:\n%s\n' \
              "$release_version" "$version_output" >&2
            exit 1
          fi

      - name: Test packed package with npm 12
        run: npm run test:package

      - name: Pack npm packages
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          mkdir -p tarballs
          package_directories=(release-packages/*)

          if ((${#package_directories[@]} != 6)); then
            printf 'Expected six npm package directories, found %s\n' \
              "${#package_directories[@]}" >&2
            exit 1
          fi

          for package_directory in "${package_directories[@]}"; do
            npm pack "$package_directory" --pack-destination tarballs
          done

      - name: Upload npm packages
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: npm/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish-npm:
    name: Publish to npm
    needs: prepare-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm 12
        run: |
          set -Eeuo pipefail
          npm install --global npm@12
          [[ "$(npm --version)" == 12.* ]]

      - name: Download npm packages
        uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: npm-packages

      - name: Publish platform packages and main package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          release_version="${RELEASE_TAG#v}"
          node npm/scripts/publish-packages.js \
            npm-packages \
            "$release_version"

  smoke-test-npm:
    name: Smoke-test npm package
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Smoke-test published package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          release_version="${RELEASE_TAG#v}"
          version_output=""

          for attempt in {1..12}; do
            if version_output="$(
              npm exec \
                --prefer-online \
                --yes \
                --package="telegram-owl@${release_version}" \
                -- \
                telegram-owl --version
            )" &&
              grep -Fqx "telegram-owl v${release_version}" <<<"$version_output"; then
              printf '%s\n' "$version_output"
              exit 0
            fi

            if ((attempt == 12)); then
              printf 'telegram-owl@%s did not report the expected version. Last output:\n%s\n' \
                "$release_version" "$version_output" >&2
              exit 1
            fi

            sleep 10
          done
