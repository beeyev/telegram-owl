# Alexander Tebiev - https://github.com/beeyev
name: Release 🚀

on:
  push:
    tags:
      - "v*.*.*" # Trigger on semantic version tags like v1.2.3

permissions:
  contents: write # For creating GitHub releases
  packages: write # If using GitHub Packages
  id-token: write # For signing GitHub artifact attestations
  attestations: write # For storing GitHub artifact attestations
  artifact-metadata: write # For recording attested artifacts

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 🛠 Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for GoReleaser to detect version info

      - name: 🧰 Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Verify module dependencies
        run: go mod verify

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: 🍫 install chocolatey
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          sudo apt-get --quiet update
          sudo apt-get --no-install-suggests --no-install-recommends --quiet --yes install dirmngr ca-certificates gnupg
          sudo gpg --homedir /tmp --no-default-keyring --keyring /usr/share/keyrings/mono-official-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/debian stable-buster main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt-get --quiet update
          sudo apt-get --no-install-suggests --no-install-recommends --quiet --yes install mono-devel
          mkdir -p /opt/chocolatey
          wget -q -O - "https://github.com/chocolatey/choco/releases/download/${CHOCOLATEY_VERSION}/chocolatey.v${CHOCOLATEY_VERSION}.tar.gz" | tar -xz -C "/opt/chocolatey"
          echo '#!/bin/bash' >> /usr/local/bin/choco
          echo 'mono /opt/chocolatey/choco.exe $@' >> /usr/local/bin/choco
          chmod +x /usr/local/bin/choco

          echo "🔹 Choco version: $(choco --version)"
        env:
          CHOCOLATEY_VERSION: 2.4.1

      - name: ℹ️ Version Info
        run: |
          echo "🔹 Go version: $(go version)"
          echo ""
          echo "🔹 Current tag: ${{ github.ref_name }}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: 🚀 Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: >-
            release --clean
            ${{ contains(github.ref_name, '-') && '--skip=chocolatey' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/telegram-owl_${{ github.ref_name }}_checksums.txt

      - name: Attest container images
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/digests.txt
