# Alexander Tebiev - https://github.com/beeyev
name: 🧪 Unit Tests & 🔍 Linters

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: ✅ Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v7

      - name: 🧰 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: 📖 Display Go Version
        run: go version

      - name: 🔍 Run Unit Tests with Race Detection and Coverage
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: 📦 Verify Module Metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: 🧪 Build (Validation)
        run: go build -v ./...

  golangci-lint:
    name: ✨ Lint with golangci-lint + reviewdog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v7

      - name: 🧰 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: 🐶 Setup reviewdog
        uses: reviewdog/action-setup@v1

      - name: 🧪 Run golangci-lint via reviewdog
        run: |
          set -o pipefail

          go tool golangci-lint run \
            --output.text.path=stderr \
            --output.checkstyle.path=stdout \
            --issues-exit-code=0 \
            ./... \
            | reviewdog \
              -f=checkstyle \
              -name="golangci-lint" \
              -filter-mode="nofilter" \
              -reporter="${REVIEWDOG_REPORTER}" \
              -fail-on-error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_REPORTER: ${{ github.event_name == 'pull_request' && 'github-pr-check' || 'github-check' }}
