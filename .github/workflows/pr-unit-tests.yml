# Alexander Tebiev - https://github.com/beeyev
name: 🧪 Unit Tests & 🔍 Linters

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_LEGACY_WIN7_VERSION: "1.27.1-1" # thongtech/go-legacy-win7 release, without "v"

jobs:
  unit-tests:
    name: ✅ Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v7

      - name: 🧰 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: 📖 Display Go Version
        run: go version

      - name: 🔍 Run Unit Tests with Race Detection and Coverage
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: 📦 Verify Module Metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: 🧪 Build (Validation)
        run: go build -v ./...

  windows-legacy-builds:
    name: Build Windows 7 binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go with Windows 7 support
        uses: ./.github/actions/setup-go-legacy-win7
        with:
          version: ${{ env.GO_LEGACY_WIN7_VERSION }}

      - name: Build Windows binary
        run: |
          set -Eeuo pipefail
          for goarch in 386 amd64; do
            GOOS=windows GOARCH="$goarch" CGO_ENABLED=0 \
              go build -mod=readonly -trimpath \
                -o "${RUNNER_TEMP}/telegram-owl-${goarch}.exe" ./cmd/telegram-owl
          done

  npm-tests:
    name: Test npm package with Node ${{ matrix.node-version }} and npm 12
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Use npm 12
        run: |
          set -Eeuo pipefail
          npm install --global npm@12
          [[ "$(npm --version)" == 12.* ]]

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Run npm package tests
        run: |
          set -Eeuo pipefail
          npm test
          npm run test:package

  golangci-lint:
    name: ✨ Lint with golangci-lint + reviewdog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v7

      - name: 🧰 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: 🐶 Setup reviewdog
        uses: reviewdog/action-setup@v1

      - name: 🧪 Run golangci-lint via reviewdog
        run: |
          set -o pipefail

          go tool golangci-lint run \
            --output.text.path=stderr \
            --output.checkstyle.path=stdout \
            --issues-exit-code=0 \
            ./... \
            | reviewdog \
              -f=checkstyle \
              -name="golangci-lint" \
              -filter-mode="nofilter" \
              -reporter="${REVIEWDOG_REPORTER}" \
              -fail-on-error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_REPORTER: ${{ github.event_name == 'pull_request' && 'github-pr-check' || 'github-check' }}
